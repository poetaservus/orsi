[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orsi-portable-chat"
version = "0.1.0"
description = "Portable local-first conversational AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "openai==2.54.0",
  "PyYAML>=6.0.2,<7",
  "pypdf==6.19.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
windows = ["PySide6>=6.7", "Pygments>=2.19,<3"]
inference = ["llama-cpp-python>=0.2.80"]
test = ["pytest>=8"]

[project.scripts]
orsi = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ui" = ["assets/sounds/*.ogg"]
