[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orsi-portable-chat"
version = "0.1.0"
description = "Portable local-first conversational AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "openai==2.54.0",
  "PyYAML>=6.0.2,<7",
  "pypdf==6.19.0",
  "defusedxml==0.7.1",
  "langid==1.1.6",
]

[project.optional-dependencies]
windows = ["PySide6>=6.7", "Pygments>=2.19,<3", "PyNaCl==1.6.2"]
inference = ["llama-cpp-python>=0.2.80"]
test = ["pytest>=8"]
verification = ["playwright==1.63.0", "pywinauto==0.6.9", "psutil>=7,<8", "Pillow>=11,<13"]
vault-prototype = ["PyNaCl==1.6.2"]
vault = ["PyNaCl==1.6.2"]

[project.scripts]
orsi = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.conversation" = ["personalities/*.txt"]
"app.ui" = ["assets/sounds/*.ogg", "assets/*.svg", "assets/*.png", "assets/fonts/*"]
